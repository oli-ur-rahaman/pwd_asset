        - generic [ref=f1e29]:
          - heading "Welcome to UHC Infrastructure Assessment Portal" [level=2] [ref=f1e30]
          - paragraph [ref=f1e31]: A centralized platform for assessing infrastructure, existing facilities, and demands of Upazila Health Complexes.
          - generic [ref=f1e32]:
            - generic [ref=f1e33]:
              - heading "1. Purpose of the System" [level=3] [ref=f1e34]
              - paragraph [ref=f1e35]: This system is explicitly designed for the centralized management, real-time assessment, and systematic preservation of infrastructure data, current physical facility conditions, and future structural demands across all Upazila Health Complexes.
            - generic [ref=f1e36]:
              - heading "2. Data Entry & Update" [level=3] [ref=f1e37]
              - list [ref=f1e38]:
                - listitem [ref=f1e39]:
                  - strong [ref=f1e40]: +Add Asset
                  - text: can be used to enter information individually.
                - listitem [ref=f1e41]:
                  - strong [ref=f1e42]: Bulk Entry
                  - text: can be used to upload multiple records at once.
                - listitem [ref=f1e43]: Any errors can be corrected instantly from the Audit Review section.
                - listitem [ref=f1e44]:
                  - text: Existing information can be updated anytime using
                  - strong [ref=f1e45]: Edit
                  - text: .
                - listitem [ref=f1e46]: Go through each and every tab on top of the page and provide information regarding civil, sanitary and EM facilities. Each Tab needs separate Declaration after completion.
                - listitem [ref=f1e47]:
                  - text: After completing all entries, use
                  - strong [ref=f1e48]: Declare as Completed
                  - text: to finalize submission.
            - generic [ref=f1e49]:
              - heading "3. Office Orders & Downloads" [level=3] [ref=f1e50]
              - list [ref=f1e51]:
                - listitem [ref=f1e52]:
                  - text: Necessary office orders, letters, and files can be viewed from the
                  - strong [ref=f1e53]: Office Orders
                  - text: menu.
                - listitem [ref=f1e54]:
                  - text: Download the prescribed format from
                  - strong [ref=f1e55]: Excel Template
                  - text: .
                - listitem [ref=f1e56]:
                  - text: Your office data can be exported in Excel format using
                  - strong [ref=f1e57]: Download Data
                  - text: .
